[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-planner"
version = "0.2.0"
description = "Deterministic local task planner for generating Codex harness task files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["codex", "planning", "tasks", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
codex-task-planner = "codex_task_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
